<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gerador de Catálogo PDF</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-50">
<div class="max-w-4xl mx-auto p-6">
<h1 class="text-3xl font-bold mb-6">Gerador de Catálogo PDF</h1>
<div class="bg-white p-6 rounded shadow">
<input id="url" class="w-full border p-3 rounded mb-3" placeholder="https://www.zoeveos.com" value="https://www.zoeveos.com">
<button id="extract" class="bg-blue-600 text-white px-6 py-3 rounded">Extrair Produtos</button>
<div id="status" class="mt-4 text-sm"></div>
<div id="preview" class="mt-6 grid grid-cols-2 md:grid-cols-3 gap-4"></div>
<button id="pdf" class="hidden mt-6 bg-green-600 text-white px-6 py-3 rounded">Gerar PDF</button>
</div>
</div>
<div id="catalog" style="position:absolute;left:-9999px;width:794px;background:white"></div>
<script src="app.js"></script>
</body>
</html>
