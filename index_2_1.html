<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Gerador de Catálogo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
    window.firebaseInit = { initializeApp, getFirestore, collection, addDoc, serverTimestamp };
  </script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-50 text-gray-900">
  <div class="max-w-6xl mx-auto p-6">
    <header class="flex items-center justify-between mb-8">
      <h1 class="text-3xl font-bold">Catálogo Pro</h1>
      <a href="https://github.com" target="_blank" class="text-sm text-gray-500">GitHub + Vercel</a>
    </header>

    <div class="bg-white rounded-2xl shadow p-6 mb-6">
      <label class="block text-sm font-medium mb-2">URL da loja</label>
      <div class="flex gap-2">
        <input id="siteUrl" type="url" placeholder="https://sualoja.com" class="flex-1 border rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-black"/>
        <button id="btnExtract" class="bg-black text-white px-6 py-3 rounded-xl font-medium hover:opacity-90">Extrair</button>
      </div>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mt-4">
        <input id="logoUrl" type="url" placeholder="Logo da loja (opcional)" class="border rounded-xl px-4 py-2"/>
        <input id="brandName" type="text" placeholder="Nome da marca" class="border rounded-xl px-4 py-2"/>
        <input id="cloudName" type="text" placeholder="Cloudinary cloud name" class="border rounded-xl px-4 py-2"/>
      </div>
      <p id="status" class="text-sm text-gray-500 mt-3"></p>
    </div>

    <div id="actions" class="hidden mb-6 flex gap-3">
      <button id="btnPdf" class="bg-emerald-600 text-white px-5 py-3 rounded-xl">Gerar PDF</button>
      <button id="btnSave" class="border px-5 py-3 rounded-xl">Salvar no Firebase</button>
    </div>

    <div id="catalog" class="bg-white rounded-2xl shadow p-8">
      <div id="cover" class="text-center py-12 border-b">
        <img id="coverLogo" class="mx-auto h-16 object-contain hidden mb-4"/>
        <h2 id="coverTitle" class="text-4xl font-bold">Catálogo de Produtos</h2>
        <p id="coverSub" class="text-gray-500 mt-2"></p>
      </div>
      <div id="catalogContent" class="mt-8 space-y-12"></div>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
